[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdiff"
version = "0.1.0"
description = "Watch a file and print line-level diffs as it changes."
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
watchdiff = "watchdiff.cli:main"

[tool.setuptools.packages.find]
include = ["watchdiff*"]
